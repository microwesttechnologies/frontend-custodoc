<app-modal
  [customStylesBody]="{ padding: 0, overflow: 'hidden' }"
  (eventButtonClick)="eventClose.emit()"
  [primaryButton]="{ text: 'Cerrar' }"
  [secondaryButton]="{ hidden: true }"
  [customStyles]="{ height: '95vh' }"
  size="md"
>
  @if(fileUrl){
  <iframe
    [src]="fileUrl! | safeUrl"
    frameborder="0"
    height="100%"
    width="100%"
  ></iframe>
  }
</app-modal>
