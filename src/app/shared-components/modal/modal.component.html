<div class="primary-modal-background primary-typography center-all">
  <div
    class="content-modal modal-{{ size }}"
    [@slideEnterAndLeaveTop]
    [ngStyle]="customStyles"
  >
    @if(title){
    <div class="content-modal-header">
      <h3 class="font-headline-small cl-secondary-background-theme-important">
        {{ title }}
      </h3>
    </div>
    }
    <div class="content-modal-body">
      <ng-content></ng-content>
    </div>
    <div
      class="content-modal-footer display-flex align-items-center justify-content-flex-end"
    >
      @if(!secondaryButton?.hidden){
        <button
        class="primary-button button-md bg-transparent w-1000-rem"
        (click)="eventButtonClick.emit(false)"
        [appDisabledElement]="secondaryButton?.disabled || loadingButtons"
      >
        @if(loadingButtons){
        <i class="material-symbols-outlined loading-icon">progress_activity</i>
        }@else { {{ secondaryButton?.text || "Cancelar" }} }
      </button>
      }
      @if(!primaryButton?.hidden){
      <button
        [appDisabledElement]="primaryButton?.disabled || loadingButtons"
        class="primary-button button-md w-1000-rem ml-100-rem"
        (click)="eventButtonClick.emit(true)"
      >
        @if(loadingButtons){
        <i
          class="material-symbols-outlined loading-icon cl-secondary-background-theme-important"
          >progress_activity</i
        >
        }@else { {{ primaryButton?.text || "Aceptar" }} }
      </button>
      }
    </div>
  </div>
</div>
